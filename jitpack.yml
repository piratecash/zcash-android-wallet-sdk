jdk:
  - openjdk17

before_install:
  - export ANDROID_HOME="${HOME}/android-sdk"; export ANDROID_SDK_ROOT="${ANDROID_HOME}"; mkdir -p "${ANDROID_HOME}/cmdline-tools"; curl -sSLo /tmp/android-commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip; unzip -q /tmp/android-commandlinetools.zip -d /tmp/android-commandlinetools; rm -rf "${ANDROID_HOME}/cmdline-tools/latest"; mv /tmp/android-commandlinetools/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"; yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
  - curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.84.1 --profile minimal
  - export PATH="${HOME}/.cargo/bin:${PATH}"; rustup default 1.84.1; rustup target add --toolchain 1.84.1 armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

install:
  - export ANDROID_HOME="${HOME}/android-sdk"; export ANDROID_SDK_ROOT="${ANDROID_HOME}"; export PATH="${HOME}/.cargo/bin:${PATH}"; ./gradlew :sdk-lib:testDebugUnitTest publishToMavenLocal -PIS_SNAPSHOT=false -PZCASH_SKIP_SIGNING=true -PLIBRARY_VERSION=${VERSION}
