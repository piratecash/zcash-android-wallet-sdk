jdk:
  - openjdk17

before_install:
  - yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"
  - curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.84.1 --profile minimal
  - export PATH="${HOME}/.cargo/bin:${PATH}"
  - rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

install:
  - export PATH="${HOME}/.cargo/bin:${PATH}"; ./gradlew :sdk-lib:testDebugUnitTest publishToMavenLocal -PIS_SNAPSHOT=false -PZCASH_SKIP_SIGNING=true -PLIBRARY_VERSION=${VERSION}
